<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kirby Dev Login cover</title>
<style>
	/* cover.mjs puts the fonts' @font-face rules here */
	/*{{fonts}}*/

	/* the Panel's look: its gray, its card; Inter for its system font */
	:root {
		--back: #efefef;
		--text: #000;
		--dimmed: #6b6b6b;
		--font: "Inter Variable", sans-serif;
		--mono: "JetBrains Mono", monospace;
	}
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1280px; height: 640px; overflow: hidden; }
	body {
		background: var(--back);
		color: var(--text);
		font-family: var(--font);
		display: grid;
		grid-template-columns: 1fr 440px;
		align-items: center;
		padding: 0 96px 0 104px;
		gap: 48px;
	}
	.eyebrow {
		font-size: 20px;
		color: var(--dimmed);
		margin-bottom: 18px;
	}
	h1 {
		font-size: 84px;
		font-weight: 600;
		letter-spacing: -0.03em;
		line-height: 1;
		margin-bottom: 28px;
	}
	.lead {
		font-size: 30px;
		line-height: 1.3;
		letter-spacing: -0.01em;
		max-width: 580px;
		margin-bottom: 40px;
	}
	code {
		display: inline-block;
		font-family: var(--mono);
		font-size: 14px;
		white-space: nowrap;
		background: #fff;
		border-radius: 6px;
		padding: 12px 16px;
		box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
	}
	code span { color: var(--dimmed); }
	.shot {
		position: relative;
		justify-self: end;
	}
	.shot img {
		display: block;
		width: 387px; /* the 352 px dialog × 1.1 */
		border-radius: 9px;
		box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06), 0 18px 40px rgba(0, 0, 0, 0.12);
	}
	.pointer {
		position: absolute;
		width: 30px;
		/* cover.mjs sets left and top: the fingertip in the right edge of
		   the third button, the hand beside the fourth */
		filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.35));
	}
</style>
</head>
<body>
	<div>
		<p class="eyebrow">Kirby plugin</p>
		<h1>Dev Login</h1>
		<p class="lead">One click on an account logs you into the Panel. For local development.</p>
		<code><span>$</span> composer require --dev volkmann-design-code/kirby-dev-login</code>
	</div>
	<div class="shot">
		<img src="{{dialog}}" alt="">
		<!-- a hand pointer, as over a link -->
		<svg class="pointer" style="{{pointer}}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
			<path d="M11 3.5c1.1 0 2 .9 2 2v9.2l.6-.1c.3-.9 1.1-1.5 2.1-1.5 1.1 0 2 .7 2.1 1.7.4-.5 1-.8 1.7-.8 1.1 0 2 .8 2.2 1.8.4-.4 1-.6 1.6-.6 1.2 0 2.2 1 2.2 2.2v6.1c0 4.1-3.3 7.5-7.5 7.5h-2.3c-2.4 0-4.6-1.1-6-3l-5.2-6.9c-.7-.9-.5-2.2.4-2.9.9-.7 2.1-.6 2.8.2L9 21.1V5.5c0-1.1.9-2 2-2z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
			<path d="M15.3 20.5v4.5M18.6 20.5v4.5M21.9 20.5v4.5" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
		</svg>
	</div>
</body>
</html>
